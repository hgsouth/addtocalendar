<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="40" fill="#4a6cf7"/>
  <!-- Calendar body -->
  <rect x="36" y="60" width="120" height="100" rx="10" fill="#ffffff"/>
  <!-- Calendar header bar -->
  <rect x="36" y="60" width="120" height="34" rx="10" fill="#ffffff"/>
  <rect x="36" y="80" width="120" height="14" fill="#e0e6ff"/>
  <!-- Hanging tabs -->
  <rect x="64" y="44" width="14" height="28" rx="7" fill="#ffffff"/>
  <rect x="114" y="44" width="14" height="28" rx="7" fill="#ffffff"/>
  <!-- Date dots row 1 -->
  <circle cx="66" cy="124" r="7" fill="#4a6cf7"/>
  <circle cx="96" cy="124" r="7" fill="#4a6cf7"/>
  <circle cx="126" cy="124" r="7" fill="#4a6cf7"/>
  <!-- Date dots row 2 -->
  <circle cx="66" cy="146" r="7" fill="#4a6cf7"/>
  <circle cx="96" cy="146" r="7" fill="#4a6cf7"/>
</svg>
